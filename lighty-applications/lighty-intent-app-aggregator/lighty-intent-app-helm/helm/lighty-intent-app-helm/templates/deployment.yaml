apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lighty-intent-app-helm.fullname" . }}
  labels:
    {{- include "lighty-intent-app-helm.labels" . | nindent 4 }}
spec:
  # IntentAppModule only ever builds a single-node controller - it has no pekko clustering
  # support, so unlike lighty-rnc-app-helm this chart does not expose a replicaCount.
  replicas: 1
  selector:
    matchLabels:
      {{- include "lighty-intent-app-helm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lighty-intent-app-helm.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.name }}:{{ .Values.image.version }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [ "-c", "{{ .Values.lighty.workdir }}/{{ .Values.lighty.configDirectoryName }}/{{ .Values.lighty.configFilename }}" ]
          volumeMounts:
            - name: config-volume
              mountPath: {{ .Values.lighty.workdir }}/{{ .Values.lighty.configDirectoryName }}
          startupProbe:
            httpGet:
              path: /{{ .Values.lighty.restconf.restconfPath }}/data/lighty-intent:intents
              port: {{ .Values.lighty.restconf.restconfPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 20
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /{{ .Values.lighty.restconf.restconfPath }}/data/lighty-intent:intents
              port: {{ .Values.lighty.restconf.restconfPort }}
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /{{ .Values.lighty.restconf.restconfPath }}/data/lighty-intent:intents
              port: {{ .Values.lighty.restconf.restconfPort }}
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 1
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: {{ .Values.deploymentSecurity.runAsUser }}
            capabilities:
              drop:
                - all
          env:
            - name: JAVA_OPTS
              value: "-Dlog4j.configurationFile={{ .Values.lighty.configDirectoryName }}/{{ .Values.lighty.loggerConfigFilename }}"
          ports:
            - name: restconf
              containerPort: {{ .Values.lighty.restconf.restconfPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: {{ .Chart.Name }}-slm
          # Runs in the same pod as the app, reachable at localhost - see values.yaml's
          # lighty.nlSlm.baseUrl. The image's Python base sets up no non-root user, so (unlike
          # the app container above) this one gets no runAsUser override.
          image: "{{ .Values.slmImage.name }}:{{ .Values.slmImage.version }}"
          imagePullPolicy: {{ .Values.slmImage.pullPolicy }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 1
          ports:
            - name: slm-http
              containerPort: 8000
              protocol: TCP
          resources:
            {{- toYaml .Values.slmResources | nindent 12 }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "lighty-intent-app-helm.fullname" . }}
