apiVersion: v1
kind: Service
metadata:
  name: {{ include "lighty-intent-app-helm.fullname" . }}
spec:
  {{- if .Values.nodePort.useNodePort }}
  type: NodePort
  {{- end}}
  ports:
    - protocol: TCP
      name: http-restconf
      port: {{ .Values.lighty.restconf.restconfPort }}
      {{- if .Values.nodePort.useNodePort }}
      targetPort: {{ .Values.lighty.restconf.restconfPort }}
      nodePort: {{ .Values.nodePort.restconfNodePort }}
      {{- end }}
  selector:
    {{- include "lighty-intent-app-helm.selectorLabels" . | nindent 4 }}
